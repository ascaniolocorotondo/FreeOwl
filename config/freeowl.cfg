
// ===================== Free Owl =====================
// Questo blocco viene aggiunto in fondo a librewolf.cfg dallo script di build.

// Account Mozilla (Sync) attivo: LibreWolf lo disattiva di default.
defaultPref("identity.fxaccounts.enabled", true);

// HTTPS forzato ovunque, anche in navigazione privata.
defaultPref("dom.security.https_only_mode", true);
defaultPref("dom.security.https_only_mode_pbm", true);
defaultPref("dom.security.https_only_mode_ever_enabled", true);

// Meno cookie: blocca tutti i cookie di terze parti...
defaultPref("network.cookie.cookieBehavior", 1);
defaultPref("network.cookie.cookieBehavior.pbmode", 1);
// La modalita' "Rigorosa" riscrive i cookie a ogni avvio: le diciamo di usare 1 invece di 5.
defaultPref("browser.contentblocking.features.strict", "tp,tpPrivate,cookieBehavior1,cookieBehaviorPBM1,cryptoTP,fp,stp,emailTP,emailTPPrivate,-consentmanagerSkip,-consentmanagerSkipPrivate,lvl2,rp,rpTop,qps,qpsPBM,fpp,fppPrivate,btp,lna");
// ...e rifiuta in automatico i banner dei cookie.
defaultPref("cookiebanners.service.mode", 1);
defaultPref("cookiebanners.service.mode.privateBrowsing", 1);
defaultPref("cookiebanners.ui.desktop.enabled", true);

// Estensione Free Owl (nuova scheda, contatore, Vola via, Modalità Notte).
// Non e' firmata da Mozilla, quindi serve accettare estensioni non firmate.
defaultPref("xpinstall.signatures.required", false);
// UUID fisso, cosi' la pagina iniziale puo' puntare alla nuova scheda del gufo.
defaultPref("extensions.webextensions.uuids", "{\"freeowl@freeowl.local\":\"6f1e0c2a-4b7d-4e8a-9c3f-0d5a7b2e9f41\"}");
defaultPref("browser.startup.homepage", "moz-extension://6f1e0c2a-4b7d-4e8a-9c3f-0d5a7b2e9f41/newtab.html");
defaultPref("browser.startup.page", 1);

// Motore di ricerca: Google, Bing & co. sono rimossi dalle policy, resta DuckDuckGo.
// Si cambia da Impostazioni > Ricerca (ci sono solo motori rispettosi della privacy).
// =================== fine Free Owl ===================
