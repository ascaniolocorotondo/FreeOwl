# Progetto Xcode generato sul robot di GitHub con XcodeGen (non serve un Mac)
name: FreeOwl
options:
  bundleIdPrefix: io.github.ascaniolocorotondo
  deploymentTarget:
    iOS: "16.0"
targets:
  FreeOwl:
    type: application
    platform: iOS
    sources: [FreeOwl]
    scheme: {}
    info:
      path: FreeOwl/Info.plist
      properties:
        CFBundleDisplayName: Free Owl
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ascaniolocorotondo.freeowl
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
